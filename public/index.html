<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구룡투 실시간 온라인 대전</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --primary: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 95%; max-width: 600px; background: var(--panel); border: 2px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; }
        .lobby, .game-screen { display: flex; flex-direction: column; gap: 15px; }
        .hidden { display: none !important; }
        input { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: white; font-size: 1rem; }
        button { background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .board { background: #0f172a; border: 2px dashed var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .board-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; color: #94a3b8; }
        
        .history-container { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; min-height: 55px; align-items: center; }
        .history-slot { display: flex; flex-direction: column; gap: 3px; align-items: center; background: #1e293b; border: 1px solid var(--border); padding: 4px; border-radius: 6px; min-width: 40px; }

        .card { width: 35px; height: 50px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: 2px solid #555; }
        .card-odd { background: #ffffff; color: #0f172a; } /* 홀수: 흰색 */
        .card-even { background: #000000; color: #ffffff; border-color: #555; } /* 짝수: 검정색 */
        .card.disabled { opacity: 0.3; cursor: not-allowed; }
        
        .card-slot { width: 35px; height: 50px; border: 2px solid var(--border); border-radius: 4px; display: flex; justify-content: center; align-items: center; background: #1e293b; font-weight: bold; font-size: 0.9rem; }
        
        .hand { display: flex; gap: 6px; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐉 구룡투 실시간 온라인 대전</h1>

    <div id="lobby-screen" class="lobby">
        <p>함께 플레이할 방 코드를 입력하세요.</p>
        <input type="text" id="room-input" placeholder="예: room123">
        <button onclick="joinGame()">방 입장하기</button>
    </div>

    <div id="game-screen" class="game-screen hidden">
        <div style="display:flex; justify-content:space-between; font-weight:bold;">
            <span id="role-text" style="color:var(--primary);">역할: 대기중</span>
            <span>스코어 - P1: <span id="p1-score">0</span>승 / P2: <span id="p2-score">0</span>승</span>
        </div>

        <div class="board">
            <div style="font-size:0.8rem; color:#f59e0b; font-weight:bold;">진행 중인 턴</div>
            <div class="board-row">
                <span>상대방:</span>
                <div id="slot-opponent" class="card-slot">-</div>
            </div>
            <div class="board-row">
                <span>내 카드:</span>
                <div id="slot-my" class="card-slot">-</div>
            </div>

            <hr style="border:0; border-top:1px solid var(--border); margin: 5px 0;">
            
            <div style="font-size:0.8rem; color:#94a3b8; font-weight:bold;">이전 턴들에 낸 카드 기록</div>
            <div id="history-list" class="history-container">
                <span style="font-size:0.8rem; color:#64748b;">아직 기록이 없습니다.</span>
            </div>
        </div>

        <div id="status-msg" style="text-align:center; color:#94a3b8; font-size:0.95rem;">상대방을 기다리는 중입니다...</div>

        <div>
            <div style="font-size:0.85rem; margin-bottom:5px;">내 손패 (홀수: 흰색 / 짝수: 검정색)</div>
            <div id="my-hand" class="hand"></div>
        </div>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myRole = null;
    let currentRoom = null;
    let myLastSelectedCard = null;

    function joinGame() {
        const roomCode = document.getElementById('room-input').value.trim();
        if (!roomCode) {
            alert('방 코드를 입력해주세요.');
            return;
        }
        currentRoom = roomCode;
        socket.emit('joinRoom', roomCode);

        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
    }

    socket.on('assignedRole', (role) => {
        myRole = role;
        document.getElementById('role-text').innerText = `역할: 플레이어 ${role === 'p1' ? '1' : '2'}`;
    });

    socket.on('errorMsg', (msg) => {
        alert(msg);
        location.reload();
    });

    socket.on('updateState', (room) => {
        document.getElementById('p1-score').innerText = room.wins.p1;
        document.getElementById('p2-score').innerText = room.wins.p2;

        const isP1 = (myRole === 'p1');
        const myTurn = room.turn;
        const isMyTurn = (myTurn === myRole);

        // 상대방이 낸 카드 카드 객체 추출
        const oppCard = isP1 ? room.selected.p2 : room.selected.p1;
        const oppSlot = document.getElementById('slot-opponent');
        oppSlot.className = 'card-slot';
        
        if (oppCard !== null) {
            // 숫자는 숨기고 색상(홀수:흰색, 짝수:검정색)만 표시
            const isOdd = (oppCard % 2 !== 0);
            oppSlot.innerText = '?';
            oppSlot.style.backgroundColor = isOdd ? '#ffffff' : '#000000';
            oppSlot.style.color = isOdd ? '#0f172a' : '#ffffff';
        } else {
            oppSlot.innerText = '-';
            oppSlot.style.backgroundColor = '#1e293b';
            oppSlot.style.color = '#f8fafc';
        }

        // 내 카드 슬롯 표시
        const mySlot = document.getElementById('slot-my');
        mySlot.className = 'card-slot';
        if (myLastSelectedCard !== null) {
            const isOdd = (myLastSelectedCard % 2 !== 0);
            mySlot.innerText = myLastSelectedCard;
            mySlot.style.backgroundColor = isOdd ? '#ffffff' : '#000000';
            mySlot.style.color = isOdd ? '#0f172a' : '#ffffff';
        } else {
            mySlot.innerText = '-';
            mySlot.style.backgroundColor = '#1e293b';
            mySlot.style.color = '#f8fafc';
        }

        // 이전 턴 기록 (상대방 카드는 숫자를 숨기고 색상 블록만 표시)
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';
        if (room.history.length === 0) {
            historyList.innerHTML = '<span style="font-size:0.8rem; color:#64748b;">아직 기록이 없습니다.</span>';
        } else {
            room.history.forEach((h, index) => {
                const myCard = isP1 ? h.p1Card : h.p2Card;
                const oCard = isP1 ? h.p2Card : h.p1Card;
                
                const myIsOdd = (myCard % 2 !== 0);
                const oIsOdd = (oCard % 2 !== 0);

                const slot = document.createElement('div');
                slot.className = 'history-slot';
                slot.innerHTML = `
                    <span style="font-size:0.65rem; color:#64748b;">${index+1}턴</span>
                    <div style="display:flex; gap:3px;">
                        <span style="font-size:0.6rem; padding:1px 3px; border-radius:2px; background:${oIsOdd ? '#fff':'#000'}; color:${oIsOdd?'#000':'#fff'};">상대(?)</span>
                        <span style="font-size:0.6rem; padding:1px 3px; border-radius:2px; background:${myIsOdd ? '#fff':'#000'}; color:${myIsOdd?'#000':'#fff'};">내(${myCard})</span>
                    </div>
                `;
                historyList.appendChild(slot);
            });
        }

        // 내 손패 렌더링
        const handContainer = document.getElementById('my-hand');
        handContainer.innerHTML = '';
        const myHandCards = room.hands[myRole];

        for (let i = 1; i <= 9; i++) {
            const card = document.createElement('div');
            const isOdd = (i % 2 !== 0);
            card.className = `card ${isOdd ? 'card-odd' : 'card-even'}`;

            if (myHandCards.includes(i)) {
                card.innerText = i;
                if (isMyTurn) {
                    card.onclick = () => {
                        myLastSelectedCard = i;
                        socket.emit('selectCard', { roomCode: currentRoom, card: i });
                    };
                } else {
                    card.className += ' disabled';
                }
            } else {
                card.className += ' disabled';
                card.innerText = '-';
                card.style.backgroundColor = '#1e293b';
            }
            handContainer.appendChild(card);
        }

        const statusMsg = document.getElementById('status-msg');
        if (room.players.length < 2) {
            statusMsg.innerText = "상대방을 기다리는 중입니다...";
        } else if (isMyTurn) {
            statusMsg.innerText = room.subStep === 1 ? "당신이 [선공]입니다. 카드를 먼저 내세요." : "상대방이 먼저 낸 카드의 색상을 보고 대응할 차례입니다.";
        } else {
            statusMsg.innerText = "상대방이 생각 중입니다...";
        }
    });

    socket.on('roundResult', ({ winner }) => {
        let resultText = "무승부입니다!";
        if (winner) {
            const isWin = (winner === myRole);
            resultText = isWin ? "🎉 이번 라운드 승리!" : "😢 이번 라운드 패배!";
        }
        document.getElementById('status-msg').innerText = `라운드 결과: ${resultText}`;
    });

    socket.on('gameOver', (winner) => {
        const isGameWin = (winner === myRole);
        alert(isGameWin ? "🏆 최종 승리하셨습니다!" : "💀 패배하셨습니다...");
        myLastSelectedCard = null;
    });
</script>

</body>
</html>
