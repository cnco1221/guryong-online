<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>구룡투 실시간 온라인 대전</title>
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --border: #334155; --primary: #f59e0b; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: var(--bg); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; transition: background-color 0.3s ease; }
        
        .version-badge { position: absolute; bottom: 15px; right: 20px; font-size: 0.75rem; color: #64748b; font-weight: bold; }

        .container { width: 95%; max-width: 600px; background: var(--panel); border: 2px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; }
        .lobby, .game-screen { display: flex; flex-direction: column; gap: 15px; }
        .hidden { display: none !important; }
        input { padding: 10px; border-radius: 6px; border: 1px solid var(--border); background: #0f172a; color: white; font-size: 1rem; }
        button { background: var(--primary); color: #000; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .board { background: #0f172a; border: 2px dashed var(--border); border-radius: 10px; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; }
        
        .history-container { display: flex; gap: 8px; overflow-x: auto; width: 100%; padding: 5px 0; min-height: 80px; align-items: center; justify-content: flex-start; }
        .history-slot { display: flex; flex-direction: column; gap: 3px; align-items: center; background: #1e293b; border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; min-width: 50px; flex-shrink: 0; }

        /* 모바일(좁은 화면)에서는 드래그 없이 전체 기록이 한번에 보이도록 줄바꿈 처리. PC는 위 스타일(가로 스크롤) 그대로 유지 */
        @media (max-width: 480px) {
            .history-container {
                flex-wrap: wrap;
                overflow-x: visible;
                justify-content: center;
            }
        }

        .card { width: 35px; height: 50px; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 0.9rem; cursor: pointer; border: 2px solid #555; }
        .card-odd { background: #ffffff; color: #0f172a; } 
        .card-even { background: #000000; color: #ffffff; border-color: #555; } 
        .card.disabled { opacity: 0.3; cursor: not-allowed; pointer-events: none; }
        
        .card-slot { width: 35px; height: 50px; border: 2px solid var(--border); border-radius: 4px; display: flex; justify-content: center; align-items: center; background: #1e293b; font-weight: bold; font-size: 0.9rem; }
        
        .hand { display: flex; gap: 6px; justify-content: center; }

        .countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.92); border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; z-index: 20; text-align: center; }
        .countdown-number { font-size: 4rem; font-weight: bold; color: var(--primary); animation: popScale 1s infinite; }
        @keyframes popScale { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }

        .game-over-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.96); border-radius: 10px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; gap: 10px; z-index: 10; padding: 20px; text-align: center; overflow-y: auto; }

        .timer-wrap { display: flex; align-items: center; gap: 8px; justify-content: center; }
        .timer-track { width: 140px; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
        .timer-fill { height: 100%; width: 100%; background: var(--primary); transition: width 1s linear, background-color 0.3s ease; }
        .timer-fill.urgent { background: #ef4444; }
        #timer-text { font-size: 0.8rem; color: #94a3b8; min-width: 34px; text-align: left; }

        .emoji-bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
        .emoji-btn { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; padding: 0; border: 2px solid var(--border); background: #0f172a; cursor: pointer; }
        .emoji-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .emoji-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        .emoji-popup { position: absolute; top: 50%; left: 100%; margin-left: 10px; transform: translateY(-50%) scale(0.6); opacity: 0; z-index: 25; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; }
        .emoji-popup.show { opacity: 1; transform: translateY(-50%) scale(1); }
        .emoji-bubble { position: relative; background: #f8fafc; border: 2px solid var(--border); border-radius: 16px; padding: 8px 10px 6px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 6px 16px rgba(0,0,0,0.45); }
        .emoji-bubble img { width: 84px; height: 84px; object-fit: contain; display: block; }
        .emoji-bubble::after { content: ''; position: absolute; top: 50%; left: -12px; transform: translateY(-50%); border-width: 8px 12px 8px 0; border-style: solid; border-color: transparent #f8fafc transparent transparent; }
        .emoji-popup-label { margin-top: 3px; font-size: 0.65rem; color: #0f172a; font-weight: bold; }

        .score-side { position: absolute; top: 50%; right: 100%; margin-right: 18px; transform: translateY(-50%); text-align: center; white-space: nowrap; }
    </style>
</head>
<body>

<div class="container">

    <div id="lobby-screen" class="lobby">
        <h1>🐉 구룡투 실시간 온라인 대전</h1>
        <p>함께 플레이할 방 코드를 입력하세요.</p>
        <input type="text" id="room-input" placeholder="예: room123">
        <button onclick="joinGame()">방 입장하기</button>
    </div>

    <div id="game-screen" class="game-screen hidden">
        <div class="board" id="game-board-area">
            <div id="countdown-box" class="countdown-overlay hidden">
                <div id="countdown-text" style="font-size: 1.2rem; font-weight: bold; color: #f8fafc;">상대방이 입장했습니다!</div>
                <div id="countdown-num" class="countdown-number">3</div>
            </div>

            <div id="game-over-box" class="game-over-overlay hidden">
                <h2 id="game-over-title" style="font-size: 1.4rem; color: var(--primary); margin-top: 5px;">게임 종료</h2>
                <p id="game-over-desc" style="font-size: 0.85rem; color: #94a3b8;"></p>
                
                <div style="font-size: 0.8rem; color: #f8fafc; font-weight: bold; margin-top: 5px; text-align: left; width: 100%;">전체 턴 기록 (상대방 카드 공개)</div>
                <div id="game-over-history" style="display: flex; gap: 6px; overflow-x: auto; width: 100%; padding: 5px 0; justify-content: flex-start;"></div>

                <button onclick="location.reload()" style="margin-top: 10px; padding: 6px 15px;">새 게임 시작하기</button>
            </div>

            <div style="display:flex; flex-direction:column; align-items:center; gap:5px; width:100%;">
                <span style="font-size: 0.85rem; color: #94a3b8;">상대방 낸 카드</span>
                <div style="position:relative; display:inline-block;">
                    <div class="score-side">
                        <div style="font-size:0.6rem; color:#94a3b8;">상대</div>
                        <div id="opp-score" style="font-size:1.6rem; font-weight:bold; color:#ef4444; line-height:1;">0</div>
                        <div style="font-size:0.55rem; color:#64748b;">승</div>
                    </div>
                    <div id="slot-opponent" class="card-slot">-</div>
                    <div id="emoji-popup-opp" class="emoji-popup">
                        <div class="emoji-bubble">
                            <img id="emoji-popup-opp-img" src="" alt="emoji">
                            <div id="emoji-popup-opp-label" class="emoji-popup-label"></div>
                        </div>
                    </div>
                </div>
                <span id="opp-hand-count" style="color:#f59e0b; font-size: 0.8rem; font-weight:bold;">상대 남은 손패: 백색 5장, 검정 4장</span>
            </div>

            <hr style="border:0; border-top:1px solid var(--border); width: 100%; margin: 5px 0;">

            <div style="font-size:0.8rem; color:#94a3b8; font-weight:bold; width: 100%; text-align: left;">이전 턴 기록</div>
            <div id="history-list" class="history-container">
                <span style="font-size:0.8rem; color:#64748b;">아직 기록이 없습니다.</span>
            </div>

            <hr style="border:0; border-top:1px solid var(--border); width: 100%; margin: 5px 0;">

            <div style="display:flex; flex-direction:column; align-items:center; gap:5px; width:100%;">
                <div style="position:relative; display:inline-block;">
                    <div class="score-side">
                        <div style="font-size:0.6rem; color:#94a3b8;">나</div>
                        <div id="my-score" style="font-size:1.6rem; font-weight:bold; color:#10b981; line-height:1;">0</div>
                        <div style="font-size:0.55rem; color:#64748b;">승</div>
                    </div>
                    <div id="slot-my" class="card-slot">-</div>
                    <div id="emoji-popup-mine" class="emoji-popup">
                        <div class="emoji-bubble">
                            <img id="emoji-popup-mine-img" src="" alt="emoji">
                            <div id="emoji-popup-mine-label" class="emoji-popup-label"></div>
                        </div>
                    </div>
                </div>
                <span style="font-size: 0.85rem; color: #94a3b8;">내가 낸 카드</span>
            </div>
        </div>

        <div style="width:100%;">
            <div style="font-size:0.85rem; margin-bottom:5px; text-align:center;">내 손패 (홀수: 백색 / 짝수: 검정색)</div>
            <div id="my-hand" class="hand"></div>
        </div>

        <div id="status-msg" style="text-align:center; color:#94a3b8; font-size:0.95rem;">상대방을 기다리는 중입니다...</div>

        <div id="timer-wrap" class="timer-wrap hidden">
            <span style="font-size:0.8rem; color:#94a3b8;">⏱ 제한시간</span>
            <div class="timer-track"><div id="timer-fill" class="timer-fill"></div></div>
            <span id="timer-text">20초</span>
        </div>

        <div>
            <div style="font-size:0.8rem; margin-bottom:5px; color:#94a3b8; text-align:center;">이모티콘 보내기</div>
            <div id="emoji-bar" class="emoji-bar"></div>
        </div>
    </div>
</div>

<div class="version-badge">ver.21</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io();
    let myRole = null;
    let currentRoom = null;
    let myLastSelectedCard = null;
    let isGameOver = false;
    let hasCountedDown = false;
    let isCountingDownActive = false;
    
    // 라운드별 선공 고정 변수
    let lockedRoundTurn = null;
    let lastHistoryLength = -1;

    // 턴 타이머 관련 변수
    const TURN_SECONDS_CLIENT = 20;
    let turnTimerInterval = null;
    let turnTimerEndClient = null;

    // 이모티콘 관련 변수
    const EMOJI_IDS = [1, 2, 3, 4];
    const EMOJI_COOLDOWN_MS = 5000;
    let emojiPopupTimeoutMine = null;
    let emojiPopupTimeoutOpp = null;
    let emojiCooldownActive = false;

    function setupEmojiBar() {
        const bar = document.getElementById('emoji-bar');
        bar.innerHTML = '';
        EMOJI_IDS.forEach(id => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'emoji-btn';
            btn.innerHTML = `<img src="/emojis/e${id}.png" alt="emoji${id}">`;
            btn.onclick = () => {
                if (!currentRoom || emojiCooldownActive || isGameOver) return;
                socket.emit('sendEmoji', { roomCode: currentRoom, emojiId: id });
                startEmojiCooldown();
            };
            bar.appendChild(btn);
        });
    }
    setupEmojiBar();

    function startEmojiCooldown() {
        emojiCooldownActive = true;
        document.querySelectorAll('.emoji-btn').forEach(b => { b.disabled = true; });
        setTimeout(() => {
            emojiCooldownActive = false;
            if (!isGameOver) {
                document.querySelectorAll('.emoji-btn').forEach(b => { b.disabled = false; });
            }
        }, EMOJI_COOLDOWN_MS);
    }

    function stopTurnTimerDisplay() {
        if (turnTimerInterval) {
            clearInterval(turnTimerInterval);
            turnTimerInterval = null;
        }
    }

    function updateTimerDisplay(remainingMs) {
        const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));
        const pct = Math.max(0, Math.min(100, (remainingMs / (TURN_SECONDS_CLIENT * 1000)) * 100));
        const fill = document.getElementById('timer-fill');
        const text = document.getElementById('timer-text');
        fill.style.width = pct + '%';
        text.innerText = remainingSec + '초';
        fill.classList.toggle('urgent', remainingSec <= 5);
    }

    function playSound(type) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) return;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            const now = ctx.currentTime;
            if (type === 'win') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'lose') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(392.00, now);
                osc.frequency.setValueAtTime(329.63, now + 0.12);
                osc.frequency.setValueAtTime(261.63, now + 0.24);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.start(now); osc.stop(now + 0.45);
            } else if (type === 'draw') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            }
        } catch (e) {
            console.log('Audio error:', e);
        }
    }

    function flashBackground(type) {
        const body = document.body;
        if (type === 'win') {
            body.style.backgroundColor = '#064e3b';
        } else if (type === 'lose') {
            body.style.backgroundColor = '#7f1d1d';
        } else if (type === 'draw') {
            body.style.backgroundColor = '#334155';
        }

        setTimeout(() => {
            body.style.backgroundColor = '#0f172a';
        }, 600);
    }

    function joinGame() {
        const roomCode = document.getElementById('room-input').value.trim();
        if (!roomCode) { alert('방 코드를 입력해주세요.'); return; }
        currentRoom = roomCode;
        socket.emit('joinRoom', roomCode);

        document.getElementById('lobby-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
    }

    socket.on('assignedRole', (role) => {
        myRole = role;
    });

    socket.on('errorMsg', (msg) => { alert(msg); location.reload(); });

    socket.on('turnTimer', ({ role, duration }) => {
        document.getElementById('timer-wrap').classList.remove('hidden');
        stopTurnTimerDisplay();
        turnTimerEndClient = Date.now() + duration * 1000;
        updateTimerDisplay(duration * 1000);
        turnTimerInterval = setInterval(() => {
            const remainingMs = turnTimerEndClient - Date.now();
            if (remainingMs <= 0) {
                updateTimerDisplay(0);
                stopTurnTimerDisplay();
            } else {
                updateTimerDisplay(remainingMs);
            }
        }, 200);
    });

    socket.on('emojiReceived', ({ role, emojiId }) => {
        const isMine = (role === myRole);
        const suffix = isMine ? 'mine' : 'opp';

        const popup = document.getElementById(`emoji-popup-${suffix}`);
        const img = document.getElementById(`emoji-popup-${suffix}-img`);
        const label = document.getElementById(`emoji-popup-${suffix}-label`);
        img.src = `/emojis/e${emojiId}.png`;
        label.innerText = isMine ? '나' : '상대';

        if (isMine) {
            if (emojiPopupTimeoutMine) clearTimeout(emojiPopupTimeoutMine);
        } else {
            if (emojiPopupTimeoutOpp) clearTimeout(emojiPopupTimeoutOpp);
        }

        popup.classList.remove('show');
        void popup.offsetWidth; // 애니메이션 재시작을 위한 강제 리플로우
        popup.classList.add('show');

        const t = setTimeout(() => {
            popup.classList.remove('show');
        }, 1400);

        if (isMine) emojiPopupTimeoutMine = t;
        else emojiPopupTimeoutOpp = t;
    });

    function startCountdown() {
        const box = document.getElementById('countdown-box');
        const numElem = document.getElementById('countdown-num');
        box.classList.remove('hidden');
        isCountingDownActive = true;
        
        let count = 3;
        numElem.innerText = count;

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                numElem.innerText = count;
            } else {
                clearInterval(timer);
                box.classList.add('hidden');
                isCountingDownActive = false;
                socket.emit('joinRoom', currentRoom); 
            }
        }, 1000);
    }

    socket.on('updateState', (room) => {
        const isP1 = (myRole === 'p1');
        const oppRole = isP1 ? 'p2' : 'p1';

        document.getElementById('my-score').innerText = myRole ? room.wins[myRole] : 0;
        document.getElementById('opp-score').innerText = myRole ? room.wins[oppRole] : 0;

        // 히스토리 길이 변화나 라운드 초기화 시점 감지하여 당해 턴 고정
        if (room.history.length !== lastHistoryLength) {
            lastHistoryLength = room.history.length;
            lockedRoundTurn = room.turn;
        }
        if (!lockedRoundTurn) {
            lockedRoundTurn = room.turn;
        }

        const isMyTurnInitial = (lockedRoundTurn === myRole);
        const alreadySubmitted = (room.selected[myRole] !== null);

        if (room.selected[myRole] === null) {
            myLastSelectedCard = null;
        }

        const oppHandCards = room.hands[oppRole];
        let oppWhiteCount = oppHandCards.filter(c => c % 2 !== 0).length;
        let oppBlackCount = oppHandCards.filter(c => c % 2 === 0).length;
        document.getElementById('opp-hand-count').innerText = `상대 남은 손패: 백색 ${oppWhiteCount}장 / 검정 ${oppBlackCount}장`;

        const oppCard = isP1 ? room.selected.p2 : room.selected.p1;
        const oppSlot = document.getElementById('slot-opponent');
        oppSlot.className = 'card-slot';
        
        if (oppCard !== null) {
            const isOdd = (oppCard % 2 !== 0);
            oppSlot.innerText = '?';
            oppSlot.style.backgroundColor = isOdd ? '#ffffff' : '#000000';
            oppSlot.style.color = isOdd ? '#0f172a' : '#ffffff';
        } else {
            oppSlot.innerText = '-';
            oppSlot.style.backgroundColor = '#1e293b';
            oppSlot.style.color = '#f8fafc';
        }

        const mySlot = document.getElementById('slot-my');
        mySlot.className = 'card-slot';
        if (myLastSelectedCard !== null) {
            const isOdd = (myLastSelectedCard % 2 !== 0);
            mySlot.innerText = myLastSelectedCard;
            mySlot.style.backgroundColor = isOdd ? '#ffffff' : '#000000';
            mySlot.style.color = isOdd ? '#0f172a' : '#ffffff';
        } else {
            mySlot.innerText = '-';
            mySlot.style.backgroundColor = '#1e293b';
            mySlot.style.color = '#f8fafc';
        }

        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';
        if (room.history.length === 0) {
            historyList.innerHTML = '<span style="font-size:0.8rem; color:#64748b;">아직 기록이 없습니다.</span>';
        } else {
            room.history.forEach((h, index) => {
                const myCard = isP1 ? h.p1Card : h.p2Card;
                const oCard = isP1 ? h.p2Card : h.p1Card;
                
                const myIsOdd = (myCard % 2 !== 0);
                const oIsOdd = (oCard % 2 !== 0);

                let roundRes = "";
                if (h.winner === myRole) roundRes = "<span style='color:#10b981'>승</span>";
                else if (h.winner === null) roundRes = "<span style='color:#94a3b8'>무</span>";
                else roundRes = "<span style='color:#ef4444'>패</span>";

                const slot = document.createElement('div');
                slot.className = 'history-slot';
                slot.innerHTML = `
                    <div style="font-size:0.65rem; color:#64748b; margin-bottom:2px; font-weight:bold;">
                        ${index+1}턴: ${roundRes}
                    </div>
                    <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
                        <div style="font-size:0.75rem; width: 25px; height: 35px; border-radius:3px; display:flex; justify-content:center; align-items:center; border: 1px solid #555; background:${oIsOdd ? '#fff':'#000'}; color:${oIsOdd?'#000':'#fff'}; font-weight:bold;" title="상대 카드">?</div>
                        <div style="font-size:0.75rem; width: 25px; height: 35px; border-radius:3px; display:flex; justify-content:center; align-items:center; border: 1px solid #555; background:${myIsOdd ? '#fff':'#000'}; color:${myIsOdd?'#000':'#fff'}; font-weight:bold;" title="내 카드">${myCard}</div>
                    </div>
                `;
                historyList.appendChild(slot);
            });
            historyList.scrollLeft = historyList.scrollWidth;
        }

        const isBothPlayersJoined = (room.players && room.players.length >= 2);

        if (isBothPlayersJoined && !hasCountedDown) {
            hasCountedDown = true;
            startCountdown();
        }

        const handContainer = document.getElementById('my-hand');
        handContainer.innerHTML = '';
        const myHandCards = room.hands[myRole];

        // 행동 가능 여부: 내가 선공이거나, 혹은 선공이 이미 카드를 낸 상태일 때 후공도 행동 가능
        const canActNow = isMyTurnInitial || (room.selected[oppRole] !== null);

        for (let i = 1; i <= 9; i++) {
            const card = document.createElement('div');
            const isOdd = (i % 2 !== 0);
            card.className = `card ${isOdd ? 'card-odd' : 'card-even'}`;

            if (isGameOver || isCountingDownActive || !isBothPlayersJoined || !myHandCards.includes(i) || !canActNow || alreadySubmitted) {
                card.className += ' disabled';
                if (!myHandCards.includes(i)) {
                    card.innerText = '-';
                    card.style.backgroundColor = '#1e293b';
                } else {
                    card.innerText = i;
                }
            } else {
                card.innerText = i;
                card.onclick = () => {
                    myLastSelectedCard = i;
                    socket.emit('selectCard', { roomCode: currentRoom, card: i });
                };
            }
            handContainer.appendChild(card);
        }

        const statusMsg = document.getElementById('status-msg');
        let turnText = isMyTurnInitial ? "선공입니다. 먼저 선택하세요." : "후공입니다. 대응하세요.";

        if (!isBothPlayersJoined) {
            statusMsg.innerText = "상대방이 들어오기를 기다리는 중입니다...";
        } else if (isCountingDownActive) {
            statusMsg.innerText = "상대방이 입장했습니다! 게임 시작 준비 중...";
        } else if (alreadySubmitted) {
            statusMsg.innerText = "카드를 제출했습니다. 결과를 기다리는 중...";
        } else {
            statusMsg.innerText = turnText;
        }
    });

    socket.on('roundResult', ({ winner }) => {
        lockedRoundTurn = null; // 다음 라운드를 위해 턴 고정 해제
        if (winner) {
            const isWin = (winner === myRole);
            playSound(isWin ? 'win' : 'lose');
            flashBackground(isWin ? 'win' : 'lose');
        } else {
            playSound('draw');
            flashBackground('draw');
        }
    });

    socket.on('gameOver', ({ winner, history }) => {
        isGameOver = true;
        const isGameWin = (winner === myRole);
        const isDraw = (winner === 'draw');
        playSound(isGameWin ? 'win' : (isDraw ? 'draw' : 'lose'));

        let finalTitle = isGameWin ? "🏆 최종 승리!" : (isDraw ? "🤝 무승부" : "💀 패배");
        let finalDesc = isGameWin ? "축하합니다! 상대를 압도하셨습니다." : (isDraw ? "동점입니다. 팽팽한 승부였네요!" : "아쉽습니다. 다음 기회에 도전해보세요!");

        const gameOverBox = document.getElementById('game-over-box');
        document.getElementById('game-over-title').innerText = finalTitle;
        document.getElementById('game-over-desc').innerText = finalDesc;

        const gameOverHistory = document.getElementById('game-over-history');
        gameOverHistory.innerHTML = '';
        history.forEach((h, index) => {
            const myCard = (myRole === 'p1') ? h.p1Card : h.p2Card;
            const oCard = (myRole === 'p1') ? h.p2Card : h.p1Card;
            
            const myIsOdd = (myCard % 2 !== 0);
            const oIsOdd = (oCard % 2 !== 0);

            let roundRes = "";
            if (h.winner === myRole) roundRes = "<span style='color:#10b981'>승</span>";
            else if (h.winner === null) roundRes = "<span style='color:#94a3b8'>무</span>";
            else roundRes = "<span style='color:#ef4444'>패</span>";

            const slot = document.createElement('div');
            slot.className = 'history-slot';
            slot.innerHTML = `
                <div style="font-size:0.65rem; color:#94a3b8; margin-bottom:2px; font-weight:bold;">
                    ${index+1}턴: ${roundRes}
                </div>
                <div style="display:flex; flex-direction:column; gap:4px; align-items:center;">
                    <div style="font-size:0.75rem; width: 25px; height: 35px; border-radius:3px; display:flex; justify-content:center; align-items:center; border: 1px solid #555; background:${oIsOdd ? '#fff':'#000'}; color:${oIsOdd?'#000':'#fff'}; font-weight:bold;" title="상대 카드">${oCard}</div>
                    <div style="font-size:0.75rem; width: 25px; height: 35px; border-radius:3px; display:flex; justify-content:center; align-items:center; border: 1px solid #555; background:${myIsOdd ? '#fff':'#000'}; color:${myIsOdd?'#000':'#fff'}; font-weight:bold;" title="내 카드">${myCard}</div>
                </div>
            `;
            gameOverHistory.appendChild(slot);
        });

        gameOverBox.classList.remove('hidden');
        myLastSelectedCard = null;

        document.querySelectorAll('.card').forEach(card => {
            card.classList.add('disabled');
        });

        stopTurnTimerDisplay();
        document.getElementById('timer-wrap').classList.add('hidden');
        document.querySelectorAll('.emoji-btn').forEach(btn => { btn.disabled = true; });
    });
</script>

</body>
</html>
